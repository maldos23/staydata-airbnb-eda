<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StayData Lab · Airbnb price prediction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --serie-1:#2a78d6; --serie-2:#eb6834; --serie-3:#1baf7a;
    --surface:#fcfcfb; --card:#fff; --text:#0b0b0b; --muted:#52514e; --grid:#e4e3df;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface);color:var(--text);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;line-height:1.6}
  .wrap{max-width:740px;margin:0 auto;padding:0 24px}
  .wide{max-width:1080px}
  header.top{border-bottom:1px solid var(--grid);padding:18px 0;margin-bottom:64px;background:var(--card)}
  header.top .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
  .brand{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:-.01em}
  .brand span{color:var(--serie-1)}
  .stamp{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  h1{font-family:var(--serif);font-size:clamp(34px,6vw,50px);line-height:1.13;
     letter-spacing:-.022em;font-weight:700;margin:0 0 18px}
  .dek{font-family:var(--serif);font-size:20px;line-height:1.5;color:var(--muted);margin:0 0 28px}
  .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted);
        border-top:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:14px 0;margin-bottom:64px}
  .meta b{color:var(--text);font-weight:600}
  .meta i{font-style:normal;color:var(--grid)}
  h2{font-family:var(--serif);font-size:27px;letter-spacing:-.015em;font-weight:700;
     margin:0 0 6px;padding-top:8px}
  .rule{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
        font-weight:600;margin-bottom:22px}
  section{margin-bottom:72px}
  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:1px;
        background:var(--grid);border:1px solid var(--grid)}
  .kpi{background:var(--card);padding:20px 18px}
  .kpi .v{font-family:var(--serif);font-size:31px;font-weight:700;letter-spacing:-.02em;
          line-height:1.1;font-variant-numeric:tabular-nums}
  .kpi .k{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.02em}
  /* barras */
  .bars{display:grid;gap:18px}
  .bar-row .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
               font-size:13.5px;margin-bottom:6px}
  .bar-row .lbl{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-row .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
  .bar-row .num b{color:var(--text);font-weight:600}
  .track{background:#eeeeeb;height:22px;overflow:hidden}
  .fill{height:100%;background:var(--serie-1)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:56px}
  /* figuras */
  figure{margin:0 0 56px}
  figure img{width:100%;display:block;border:1px solid var(--grid);background:var(--card)}
  figcaption{font-size:13.5px;color:var(--muted);padding-top:12px;font-family:var(--serif);font-style:italic}
  /* tablas */
  .scroll{overflow-x:auto;border:1px solid var(--grid);background:var(--card)}
  table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
  th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
  th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
     font-weight:600;position:sticky;top:0;background:var(--card)}
  th:first-child,td:first-child{text-align:left;font-weight:500}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#f7f7f5}
  .miss{display:inline-block;height:8px;background:var(--serie-2);vertical-align:middle;margin-right:8px;min-width:2px}
  /* categóricas */
  .cat{border-top:1px solid var(--grid);padding:18px 0}
  .cat h3{font-family:var(--sans);font-size:14px;font-weight:600;margin:0 0 4px}
  .cat .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:12.5px;border:1px solid var(--grid);padding:5px 11px;background:var(--card)}
  .chip b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;margin-left:6px}
  /* hallazgos */
  .find{border:1px solid var(--grid);background:var(--card);padding:20px 22px;margin-bottom:14px;
        border-left:3px solid var(--serie-1)}
  .find.high{border-left-color:var(--serie-2)}
  .find.medium{border-left-color:var(--serie-1)}
  .find.low{border-left-color:var(--serie-3)}
  .find .hd{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
  .find h3{font-size:15.5px;font-weight:600;margin:0;font-family:var(--sans)}
  .sev{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
       padding:3px 8px;border:1px solid var(--grid);color:var(--muted)}
  .find.high .sev{color:var(--serie-2);border-color:var(--serie-2)}
  .find dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
  .find dt{color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding-top:3px}
  .find dd{margin:0}
  footer{border-top:1px solid var(--grid);padding:28px 0 56px;font-size:13px;color:var(--muted)}
  @media (max-width:720px){
    .cols{grid-template-columns:1fr;gap:44px}
  }
</style>
</head>
<body>
<header class="top"><div class="wrap wide">
  <div class="brand">StayData<span>.</span>Lab</div>
  <div class="stamp" id="stamp"></div>
</div></header>

<main id="app" class="wrap"></main>

<footer><div class="wrap wide" id="foot"></div></footer>

<script src="data.js"></script>
<script>
const D = window.DATA;
const n  = v => (v ?? 0).toLocaleString('es-MX');
const d1 = v => (v ?? 0).toLocaleString('es-MX', {maximumFractionDigits:1});
const usd = v => 'USD ' + Math.round(v).toLocaleString('es-MX');
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const bars = rows => {
  const max = Math.max(...rows.map(r => r.median_price));
  return `<div class="bars">${rows.map(r => `
    <div class="bar-row">
      <div class="hd"><span class="lbl">${esc(r.label)}</span>
        <span class="num"><b>${usd(r.median_price)}</b> · ${n(r.listings)} anuncios</span></div>
      <div class="track"><div class="fill" style="width:${(r.median_price/max*100).toFixed(1)}%"></div></div>
    </div>`).join('')}</div>`;
};

const section = (title, rule, body, wide) =>
  `<section class="${wide ? 'bleed' : ''}"><div class="rule">${rule}</div><h2>${title}</h2>${body}</section>`;

const kpis = [
  ['Anuncios',        n(D.profile.rows)],
  ['Variables',       n(D.profile.columns)],
  ['Ciudades',        n(D.by_city.length)],
  ['Precio mediano',  usd(D.price.median)],
  ['Rango P10–P90',   `${Math.round(D.price.p10)}–${Math.round(D.price.p90)}`],
  ['IDs duplicados',  n(D.profile.duplicated_ids)],
];

const missing = D.profile.column_profiles.filter(c => c.missing > 0)
  .sort((a,b) => b.missing_pct - a.missing_pct);

document.getElementById('stamp').textContent = 'Ejecución · ' + D.generated_at;

document.getElementById('app').innerHTML = `
  <h1>Airbnb price prediction: la base en cifras</h1>
  <p class="dek">Perfil estructural, estadística descriptiva, anomalías y visualizaciones de
     ${n(D.profile.rows)} anuncios en ${D.by_city.length} ciudades de EE.&nbsp;UU.</p>
  <div class="meta">
    <span><b>${n(D.profile.rows)}</b> filas</span><i>/</i>
    <span><b>${n(D.profile.columns)}</b> columnas</span><i>/</i>
    <span><b>${n(D.anomalies.length)}</b> hallazgos</span><i>/</i>
    <span><b>${n(D.figures.length)}</b> figuras</span><i>/</i>
    <span>Objetivo: <b>log_price</b></span>
  </div>

  ${section('Panorama', 'Dashboard',
    `<div class="kpis">${kpis.map(([k,v]) => `<div class="kpi"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('')}</div>`)}

  ${section('Precio mediano por noche', 'Segmentos', `<div class="cols">
      <div><div class="rule">Por ciudad</div>${bars(D.by_city)}</div>
      <div><div class="rule">Por tipo de espacio</div>${bars(D.by_room_type)}</div>
    </div>`)}

  ${section('Visualizaciones', 'Figuras',
    D.figures.map(f => `<figure><img src="figures/${f.file}" alt="${esc(f.title)}" loading="lazy">
      <figcaption>${esc(f.title)}</figcaption></figure>`).join(''))}

  ${section('Estadística descriptiva', 'Variables numéricas', `<div class="scroll"><table>
      <thead><tr><th>Variable</th><th>n</th><th>Media</th><th>DE</th><th>Mín</th><th>Q1</th><th>Mediana</th><th>Q3</th><th>Máx</th></tr></thead>
      <tbody>${D.numeric.map(s => `<tr><td>${esc(s.name)}</td><td>${n(s.count)}</td><td>${d1(s.mean)}</td>
        <td>${d1(s.std)}</td><td>${d1(s.minimum)}</td><td>${d1(s.q1)}</td><td>${d1(s.median)}</td>
        <td>${d1(s.q3)}</td><td>${d1(s.maximum)}</td></tr>`).join('')}</tbody></table></div>`)}

  ${section('Frecuencias', 'Variables categóricas',
    D.categorical.map(c => `<div class="cat">
      <h3>${esc(c.name)}</h3>
      <div class="sub">${n(c.unique)} niveles · ${d1(c.missing_pct)}% sin dato</div>
      <div class="chips">${Object.entries(c.top_values).map(([k,v]) =>
        `<span class="chip">${esc(k)}<b>${n(v)}</b></span>`).join('')}</div>
    </div>`).join(''))}

  ${section('Valores faltantes', 'Completitud', `<div class="scroll"><table>
      <thead><tr><th>Columna</th><th>Tipo</th><th>Faltantes</th><th>%</th><th>Únicos</th></tr></thead>
      <tbody>${missing.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.dtype)}</td><td>${n(c.missing)}</td>
        <td><span class="miss" style="width:${(c.missing_pct*0.9).toFixed(1)}px"></span>${d1(c.missing_pct)}%</td>
        <td>${n(c.unique)}</td></tr>`).join('')}</tbody></table></div>`)}

  ${section('Hallazgos de calidad', 'Anomalías',
    D.anomalies.map(a => `<div class="find ${a.severity}">
      <div class="hd"><span class="sev">${esc(a.severity)}</span><h3>${esc(a.title)}</h3></div>
      <dl>
        <dt>Código</dt><dd>${esc(a.code)}</dd>
        <dt>Columnas</dt><dd>${a.affected_columns.map(esc).join(', ')}</dd>
        <dt>Observado</dt><dd>${esc(a.observed)}</dd>
        <dt>Propuesta</dt><dd>${esc(a.proposed_treatment)}</dd>
      </dl></div>`).join(''))}
`;

document.getElementById('foot').innerHTML =
  `StayData Lab · fuente: ${esc(D.extras.source ?? '—')} · ` +
  `registros descartados: ${n(D.extras.malformed_records)} · generado ${esc(D.generated_at)}`;
</script>
</body>
</html>
